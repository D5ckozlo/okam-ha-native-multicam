name: O-KAM Native Bridge Multicam
version: 1.3.0-multicam.4
slug: okam_native_multicam
description: Multi-camera native O-KAM bridge for Home Assistant
url: https://github.com/D5ckozlo/okam-ha-native-multicam
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: 8100
ports_description:
  8099/tcp: Native runtime status API
options:
  account_username: null
  account_password: null
  api_token: null
  camera_id: cabin
  idle_timeout_seconds: 120
  run_connect_test: false
  run_auth_test: false
  run_stream_test: false
  run_snapshot_test: false
schema:
  account_username: email
  account_password: password
  camera_password: password?
  api_token: password
  camera_id: "match(^[A-Za-z0-9_-]{1,32}$)"
  idle_timeout_seconds: "int(10,600)"
  run_connect_test: bool
  run_auth_test: bool
  run_stream_test: bool
  run_snapshot_test: bool
